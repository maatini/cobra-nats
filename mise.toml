# mise.toml — reproducible toolchain for cobra-nats
#
# This file pins Node.js (Next.js 16 UI) so every developer gets the same
# version via `mise install`.
#
# Coexistence with devbox.json
# ----------------------------
# - devbox.json  Nix env with nats-server, natscli, nodejs_22, jq, curl.
#                Use it when you need a local JetStream broker (`devbox run nats:up`).
# - mise.toml    Node runtime for the UI.
#                Node here is 22 LTS (README requires 22; Dockerfile uses
#                node:22-alpine for production images).
#
# Quick start
# -----------
#   mise install                  # download Node 22
#   eval "$(mise activate zsh)"   # or: mise activate
#   mise run setup                # npm install
#   mise run dev                  # Next.js on :3000
#
# Docs: https://mise.jdx.dev/

[tools]
# Next.js 16 / React 19 — 22 is the current Maintenance LTS and the pinned version.
node = "22"

[env]
# Disable Next.js anonymous telemetry in every mise-managed shell.
NEXT_TELEMETRY_DISABLED = "1"

# ---------------------------------------------------------------------------
# Tasks  (`mise run <name>`)
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Start the Next.js development server"
run = "npm run dev"

[tasks.build]
description = "Build the Next.js production bundle"
run = "npm run build"

[tasks.lint]
description = "Run ESLint"
run = "npm run lint"

[tasks.test]
description = "Run Playwright E2E tests (Chromium project)"
run = "npm run test"

[tasks."test:e2e"]
description = "Run Playwright E2E tests (alias of test)"
run = "npm run test:e2e"
