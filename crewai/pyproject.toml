[project]
name = "cobra-nats-crew"
version = "0.1.0"
description = "CrewAI crew for cobra-nats development, documentation, tests, and resource optimization"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
  { name = "Cobra NATS", email = "hello@example.com" },
]
dependencies = [
  "crewai[tools]>=1.15.28,<2",
  "python-dotenv>=1.1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
github = [
  "crewai-tools[github]>=1.15.28,<2",
]

[project.scripts]
cobra-nats-crew = "cobra_nats_crew.main:run"
cobra-nats-crew-check = "cobra_nats_crew.main:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.crewai]
type = "crew"
