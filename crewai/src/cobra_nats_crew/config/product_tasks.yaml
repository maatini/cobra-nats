item_hygiene:
  description: >
    HYGIENE H-A, H-C, H-D, H-E, H-F for cobra-nats at {repo_path}.

    Read {brief_path} and then package.json, Dockerfile, README.md
    Authentication Types table, docs/knowledge-base/architecture/decisions.md
    ADR-003, and every file that imports date-fns.

    Implement all of:
    1. H-A: npm install the prod versions listed in the brief (PR 98).
       Do not merge GitHub PRs. Do not use gh.
    2. H-C: Dockerfile FROM images to node:22-alpine (deps, builder, runner)
       plus a short comment that the image follows mise Node 22 LTS.
    3. H-D: README auth table lists none, user_pass, token, nkey, jwt, creds
       matching NatsAuthType.
    4. H-E: ADR-003 describes generation checks, in-flight coalescing,
       JSM bound to the live connection, MAX_POOL_SIZE 32. Read
       src/lib/nats/manager.ts first.
    5. H-F: replace date-fns with Intl helpers; npm uninstall date-fns
       if unused.

    SKIP credential trust. Verify with npx tsc --noEmit.
    Note: crewai/output/ph-01-hygiene.md
  expected_output: >
    Markdown note of versions bumped, Dockerfile/README/ADR/date-fns
    changes, tsc result. Source updated.
  agent: hygiene_engineer
  output_file: output/ph-01-hygiene.md

item_nats_v3:
  description: >
    HYGIENE H-B — nats.js v2 to v3 evaluation and optional migration at
    {repo_path}.

    Read {brief_path}, package.json, and every src file that imports nats.
    NATS 2.12 client APIs need nats.js v3.

    Either:
    A) Migrate to nats.js v3 in a complete, compiling way (server-only,
       ADR-004 local enums stay). npx tsc --noEmit must pass.
    B) Stop: write why migration is unsafe, keep nats 2.29.x, and state
       clearly that P-6 and H-G MUST be skipped.

    Do not leave mixed v2/v3 imports. SKIP credential trust.
    Note: crewai/output/ph-02-nats-v3.md
  expected_output: >
    Markdown go/no-go: migrated files and versions, or skip rationale
    for P-6 and H-G.
  agent: nats_client_engineer
  context:
    - item_hygiene
  output_file: output/ph-02-nats-v3.md

item_dashboard:
  description: >
    PRODUCT P-1 — Live dashboard charts / time series at {repo_path}.

    Read {brief_path} and docs/roadmap-sequence.md section 1. Implement
    those acceptance criteria in src/features/dashboard/.

    Bounded in-memory samples from existing dashboard actions and optional
    HTTP monitoring. Reset or segment series on active connection change.
    Unavailable metrics are not drawn as zero. SVG sparklines or
    npx shadcn@latest add chart. No database, no alerting.

    NATS stays on the server. SKIP credential trust.
    Verify npx tsc --noEmit.
    Note: crewai/output/ph-03-dashboard.md
  expected_output: >
    Markdown of sampler contract, files changed, verification.
    Dashboard charts visible in source.
  agent: frontend_engineer
  context:
    - item_hygiene
  output_file: output/ph-03-dashboard.md

item_comparison:
  description: >
    PRODUCT P-2 — Multi-tab message comparison at {repo_path}.

    Read {brief_path} and docs/roadmap-sequence.md section 3. Implement
    those acceptance criteria. Initial scope: multiple tabs on the
    CURRENT stream with independent sequence, filter, batch, loading,
    and error state. Cap tabs and batch size. Reuse getStreamMessages.
    Keep existing single-browser behavior.

    SKIP credential trust. Verify npx tsc --noEmit.
    Note: crewai/output/ph-04-comparison.md
  expected_output: >
    Markdown of tab contract, files changed, verification.
  agent: frontend_engineer
  context:
    - item_dashboard
  output_file: output/ph-04-comparison.md

item_payload_palette:
  description: >
    PRODUCT P-3 and P-4 at {repo_path}: payload formats and command
    palette actions.

    P-3: message browser, monitor expand, and publish preview show hex
    for binary payloads; decode CBOR when bytes look like CBOR; optional
    protobuf only with a user-supplied schema. No schema registry.
    Decode in the UI from already-serialized payloads.

    P-4: command-palette.tsx gains actions (New Connection, Publish,
    context-aware Purge/Delete on detail URLs). Destructive actions use
    useConfirm. Actions call existing Server Actions, not nats.

    SKIP credential trust. Verify npx tsc --noEmit.
    Note: crewai/output/ph-05-payload-palette.md
  expected_output: >
    Markdown of format detectors, palette actions, files changed.
  agent: frontend_engineer
  context:
    - item_comparison
  output_file: output/ph-05-payload-palette.md

item_kv_watch:
  description: >
    PRODUCT P-5 — KV watch / live key updates at {repo_path}.

    Read {brief_path}, src/features/kv/, and src/features/monitor/stream.ts
    (dedicated connection pattern).

    Add live updates on KV detail: dedicated connection, pause/resume.
    If a long-lived watch needs SSE, add POST /api/kv/watch with config
    in the JSON body (same rules as monitor). Document it as an
    intentional API exception. Do not put nats in the browser.

    SKIP credential trust. Verify npx tsc --noEmit.
    Note: crewai/output/ph-06-kv-watch.md
  expected_output: >
    Markdown of watch transport, files changed, verification.
  agent: backend_engineer
  context:
    - item_payload_palette
  output_file: output/ph-06-kv-watch.md

item_stream_212:
  description: >
    PRODUCT P-6 and HYGIENE H-G at {repo_path} — NATS 2.11/2.12 stream
    flags and prioritized pull.

    Read crewai/output/ph-02-nats-v3.md FIRST. If H-B did not migrate
    to nats.js v3, SKIP this entire task, write that in the note, and
    make no UI that pretends 2.12 flags exist.

    If H-B landed, extend StreamConfigDto, serialize, create/edit
    dialogs, and info view for flags the client actually types:
    AllowMsgTTL, AllowAtomicPublish, AllowMsgCounter, AllowMsgSchedules,
    PersistMode if present. Add prioritized pull on the consumer dialog
    if the client enum exists. Gate on server version when getServerInfo
    makes that easy.

    SKIP credential trust. Verify npx tsc --noEmit.
    Note: crewai/output/ph-07-stream-212.md
  expected_output: >
    Markdown: either skipped because H-B failed, or files/flags landed.
  agent: backend_engineer
  context:
    - item_nats_v3
    - item_kv_watch
  output_file: output/ph-07-stream-212.md

item_topology:
  description: >
    PRODUCT P-7 — NATS cluster topology at {repo_path}.

    Read {brief_path} and docs/roadmap-sequence.md section 2.

    REQUIRED discovery spike before any topology UI: inspect varz and
    connz shapes and getServerInfo. Do not treat connect_urls as routes.
    Do not silently widen monitoring-url-policy.ts.

    If the source cannot support a truthful partial graph, SKIP the UI
    and document the finding. If it can, add a feature folder, sanitized
    DTOs, honest partial/unavailable states, and fixture tests.

    SKIP credential trust. Verify npx tsc --noEmit after any code.
    Note: crewai/output/ph-08-topology.md
  expected_output: >
    Markdown of discovery result, skip or files changed, verification.
  agent: backend_engineer
  context:
    - item_stream_212
  output_file: output/ph-08-topology.md

item_services_backup:
  description: >
    PRODUCT P-8 and P-9 at {repo_path} — NATS Services API and stream
    backup/restore.

    P-8: add src/features/services/ only if the client can discover
    services. Thin route, sidebar, command palette, smoke test. Skip
    independently if the API is missing.

    P-9: JetStream snapshot backup/restore if the client exposes it.
    Otherwise land config JSON import (inverse of exportStreamConfig)
    and do not claim binary backup.

    SKIP credential trust. Verify npx tsc --noEmit after any code.
    Note: crewai/output/ph-09-services-backup.md
  expected_output: >
    Markdown of what landed or skipped per item, files changed.
  agent: backend_engineer
  context:
    - item_topology
  output_file: output/ph-09-services-backup.md

item_qa:
  description: >
    QA for product and hygiene work at {repo_path}.

    Read the ph-01 through ph-09 notes. Add Vitest and Playwright only
    for features that landed. Do not assert skipped 2.12 flags, topology,
    services, or backup.

    Unique NATS resource names and teardown. Seed cobra-nats-storage
    via existing helpers. Run npx vitest run for new unit tests.
    Run only named Playwright files; if NATS is not on localhost:4222
    skip that run and say so. Do not run the full suite.

    SKIP credential trust.
    Note: crewai/output/ph-10-qa.md
  expected_output: >
    Markdown of tests added, commands run, results or skip reasons.
  agent: qa_engineer
  context:
    - item_hygiene
    - item_nats_v3
    - item_dashboard
    - item_comparison
    - item_payload_palette
    - item_kv_watch
    - item_stream_212
    - item_topology
    - item_services_backup
  output_file: output/ph-10-qa.md

item_docs:
  description: >
    Documentation after product and hygiene work at {repo_path}.

    Read README.md, AGENTS.md, CLAUDE.md, docs/knowledge-base/,
    docs/roadmap-sequence.md, and the code that actually landed.

    Update:
    - README feature lists and roadmap checkboxes ONLY for epics that
      met acceptance criteria
    - Auth table if H-D is not already done
    - API exceptions if a new SSE route exists
    - Knowledge-base module pages for new domains
    - ADR-001 if a new intentional API route was added
    - Dockerfile/mise notes if H-C landed

    Do not mark topology or 2.12 flags done if they were skipped.
    SKIP credential trust redesign.
    Note: crewai/output/ph-11-docs.md
  expected_output: >
    Markdown of documentation files patched and checkbox truthfulness.
  agent: docs_writer
  context:
    - item_qa
  output_file: output/ph-11-docs.md

item_report:
  description: >
    Final implementation report for cobra-nats {current_version} at
    {repo_path} ({repo_url}).

    Use git status --short and git diff --stat. Read crewai/output/ph-*.md.

    Produce:
    1. What landed for H-A through H-G and P-1 through P-9
    2. Explicit skips (credential trust; H-B/P-6/H-G; topology; services; backup)
    3. File list
    4. Verification commands and outcomes
    5. Residual risks
    6. Reminder: this crew does not commit, push, or open PRs

    Do not start more code changes.
  expected_output: >
    A single markdown implementation report for a human reviewer.
  agent: implement_reporter
  context:
    - item_hygiene
    - item_nats_v3
    - item_dashboard
    - item_comparison
    - item_payload_palette
    - item_kv_watch
    - item_stream_212
    - item_topology
    - item_services_backup
    - item_qa
    - item_docs
  output_file: output/ph-00-report.md
