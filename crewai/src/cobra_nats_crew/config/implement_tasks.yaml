item_1_runtime_schemas:
  description: >
    ACTION 1 — Runtime schemas for cobra-nats at {repo_path}.

    Read crewai/knowledge/implement_brief.md, src/lib/server-action.ts,
    src/types/nats.ts, every src/features/*/actions.ts, and
    src/app/api/monitor/route.ts, src/app/api/os/upload/route.ts, and
    src/app/api/os/download/route.ts.

    Implement:
    1. Shared Zod schema for NatsConnectionConfig (id, name, servers[],
       authType, optional credentials/tls/monitoringUrl). Place it under
       src/lib/validation/ (new folder). Server-only module — do not import
       it from client components.
    2. Helper that parses unknown input and returns ActionResponse error
       on failure (do not throw past the wrapper unless that is already
       the file's style). Use it at the start of every exported Server
       Action that accepts a config (or a config-like first argument).
    3. Bound resource-intensive inputs: getStreamMessages batchSize max 200
       (and a sane minimum); OS upload reject files over 20mb after
       reading file.size AND document that request.formData() may allocate
       first — also check Content-Length when present and reject > 20mb
       before formData if the header exists.
    4. Zod-parse JSON bodies of /api/monitor, /api/os/download, and
       multipart fields of /api/os/upload (bucket, name, connection JSON).
    5. Keep existing ActionResponse shapes. Do not move NATS to the client.

    SKIP action 2: do not add authn/authz or change localStorage secrets.

    Verify with: npx tsc --noEmit, then npm run lint.
    Write a short note to crewai/output/implement-01-schemas.md listing
    files touched.
  expected_output: >
    Markdown note of files changed, schema locations, bounds applied, and
    tsc/lint results. Application source updated in the checkout.
  agent: backend_engineer
  output_file: output/implement-01-schemas.md

item_3_nats_manager:
  description: >
    ACTION 3 — Harden NatsManager at {repo_path}.

    Read src/lib/nats/manager.ts, connect-options.ts, server-action.ts,
    features/monitor/stream.ts, features/connections/actions.ts
    (testConnection / pingConnection).

    Implement in src/lib/nats/manager.ts (keep the singleton export):
    1. Coalesce concurrent getConnection(config.id) with an in-flight
       Promise map so two callers do not create two connections.
    2. Bind cached JetStreamManager to a connection generation (or the
       live NatsConnection). If the connection is closed/replaced, drop
       the cached JSM and recreate.
    3. Guard closeConnection vs getConnection races (do not return a
       connection that was closed; delete in-flight entries on close).
    4. Bound unused entries: a documented max pool size (e.g. 32) that
       refuses or evicts closed/stale ids. closeAll remains.
    5. Keep monitor dedicated pool keys (prefix monitor- plus config id plus timestamp) working.
    6. Do not import nats from client code. Do not add process shutdown
       hooks that break Next.js hot reload unless they are clearly safe.

    SKIP action 2.

    Verify with npx tsc --noEmit and npm run lint.
    Note: crewai/output/implement-03-nats-manager.md
  expected_output: >
    Markdown note describing the lifecycle contract, files changed, and
    verification. Source updated.
  agent: backend_engineer
  context:
    - item_1_runtime_schemas
  output_file: output/implement-03-nats-manager.md

item_4_ssrf_monitoring:
  description: >
    ACTION 4 — Restrict fetchHttpMonitoring SSRF at {repo_path}.

    Read src/features/connections/actions.ts (fetchHttpMonitoring),
    src/types/nats.ts (HttpMonitoringEndpoint), and the dashboard card.

    This app is a local-first admin UI: http://localhost:8222 MUST remain
    valid. Shared untrusted multi-tenant hosting is not a supported
    deployment (do not build a full auth gateway — that is action 2).

    Implement a small server-only URL policy module and use it in
    fetchHttpMonitoring:
    1. http: and https: only; reject credentials in the URL.
    2. Endpoint path must resolve to /varz, /jsz, or /connz only.
    3. Block link-local / metadata hosts (169.254.169.254,
       metadata.google.internal, and obvious cloud metadata names).
    4. fetch with redirect: "error" (or manual + reject).
    5. Keep the 8s timeout. Return ActionResponse errors for policy
       violations, not stack traces.

    SKIP action 2.

    Verify tsc + lint.
    Note: crewai/output/implement-04-ssrf.md
  expected_output: >
    Markdown note of the policy, files changed, and verification.
  agent: backend_engineer
  context:
    - item_1_runtime_schemas
  output_file: output/implement-04-ssrf.md

item_6_route_cleanup:
  description: >
    ACTION 6 — Exception-route and short-lived connection cleanup at
    {repo_path}.

    Read src/features/monitor/stream.ts, src/app/api/monitor/route.ts,
    src/app/api/os/download/route.ts, src/app/api/os/upload/route.ts,
    src/features/connections/actions.ts (testConnection, pingConnection).

    Implement:
    1. Monitor: on iterator failure AND abort, unsubscribe, close the
       dedicated pool id, clear heartbeat, close/error the SSE controller
       once. Do not leave the for-await hanging after abort.
    2. testConnection: always close the temp pool id in finally, including
       after getConnection succeeds and a later throw.
    3. OS download: honor request.signal abort in addition to stream
       cancel; always close the short-lived NATS connection.
    4. Small shared helper for API JSON/text error responses if it removes
       duplication without a drive-by refactor. Upload already closes in
       finally — keep that.

    SKIP action 2.

    Verify tsc + lint.
    Note: crewai/output/implement-06-cleanup.md
  expected_output: >
    Markdown note of cleanup guarantees and files changed.
  agent: backend_engineer
  context:
    - item_3_nats_manager
    - item_4_ssrf_monitoring
  output_file: output/implement-06-cleanup.md

item_5_lifecycle_tests:
  description: >
    ACTION 5 — Tests for manager lifecycle, schemas, SSRF, and API
    contracts at {repo_path}.

    If Vitest is not a dependency, add it as a devDependency (npm install
    -D vitest) and a "test:unit" script. Keep Playwright as npm test.

    Add focused unit tests (not E2E) that mock nats.connect:
    - concurrent getConnection coalesces to one connect
    - closed connection is replaced
    - JSM cache dropped when generation/connection changes
    - closeConnection removes maps; close during in-flight does not leak
      a usable closed connection
    - Zod schema rejects missing servers / invalid authType
    - monitoring URL policy rejects metadata IPs and non-http schemes;
      allows http://localhost:8222/varz

    Add a Playwright (or route-handler) test file for malformed API
    inputs: POST /api/monitor, /api/os/download, /api/os/upload with
    missing/invalid JSON. These can use request fixture against the
    Next server if playwright.config already starts webServer; otherwise
    keep them as unit tests of the parse helpers.

    SKIP action 2. Do not run the full Playwright suite.

    Run: npx vitest run, npx tsc --noEmit.
    Note: crewai/output/implement-05-tests.md
  expected_output: >
    Markdown note of tests added, commands run, and results.
  agent: qa_engineer
  context:
    - item_1_runtime_schemas
    - item_3_nats_manager
    - item_4_ssrf_monitoring
    - item_6_route_cleanup
  output_file: output/implement-05-tests.md

item_7_playwright_isolation:
  description: >
    ACTION 7 — Playwright isolation and high-impact coverage at {repo_path}.

    Read tests/helpers.ts, playwright.config.ts, tests/functional-os.spec.ts
    (shared tmp/test-upload.txt), and other functional-*.spec.ts.

    Implement:
    1. Unique temp files per test (os.tmpdir or test.info().outputPath),
       never a shared tests/../tmp/test-upload.txt.
    2. Unique NATS resource names (include worker index + timestamp or
       test id) and teardown (delete stream/kv/os created by the test)
       where a helper can do so without a large rewrite.
    3. Add or extend deterministic coverage for at least two of: stream
       purge, KV history restore, Object Store seal, monitor pause —
       only if the UI already supports the flow. Follow existing helper
       patterns (seedConnection / cobra-nats-storage).

    Do not rewrite the whole suite. Do not run every spec; run only the
    files you changed, e.g. npx playwright test tests/functional-os.spec.ts
    --project=chromium — skip that run if no NATS server is available
    and say so.

    SKIP action 2.

    Note: crewai/output/implement-07-playwright.md
  expected_output: >
    Markdown note of isolation fixes, new coverage, and any test run.
  agent: qa_engineer
  context:
    - item_5_lifecycle_tests
  output_file: output/implement-07-playwright.md

item_8_docs:
  description: >
    ACTION 8 — Documentation corrections at {repo_path} after the code
    tasks.

    Read README.md, CLAUDE.md, docs/knowledge-base/architecture/,
    docs/knowledge-base/modules/core/, modules/monitor/, modules/os/,
    modules/connections/, and the code that actually landed.

    Update docs to match implementation:
    - Three API routes (monitor SSE POST body, OS upload multipart,
      OS download stream) as intentional wrapper exceptions
    - Runtime Zod validation on actions/routes
    - NatsManager lifecycle (coalesce, generation-bound JSM, bounds)
    - Monitor cleanup / abort
    - Monitoring URL policy (localhost allowed; metadata blocked)
    - Factual: connection profiles currently persist in browser
      localStorage key cobra-nats-storage

    SKIP action 2: do not propose or document a new auth/trust-model
    design as if it were implemented. Do not claim secrets left the
    browser if they did not.

    Focused patches only.
    Note: crewai/output/implement-08-docs.md
  expected_output: >
    Markdown note of documentation files patched and what changed.
  agent: docs_writer
  context:
    - item_1_runtime_schemas
    - item_3_nats_manager
    - item_4_ssrf_monitoring
    - item_6_route_cleanup
    - item_5_lifecycle_tests
    - item_7_playwright_isolation
  output_file: output/implement-08-docs.md

item_9_performance:
  description: >
    ACTION 9 — Measure, then cheap confirmed wins at {repo_path}.

    Confirm in src/features/os/actions.ts that getOSBucket calls os.list()
    while os-detail-view.tsx also calls listObjects — duplicate listing.

    Fix: stop listing all objects inside getOSBucket (and create/seal
    only if objectCount can be derived without a second full list, or
    have the detail view use objects.length for count). Preserve list
    page behavior if listOSBuckets still needs counts.

    Record a light baseline in the note: relevant source sizes, whether
    shiki/marked are statically imported in client preview components.
    Dynamic-import preview highlighting only if a client component
    clearly pulls shiki on every OS detail load.

    Do not run a full next build unless it finishes quickly. Do not
    retune the NATS pool beyond action 3.

    SKIP action 2.

    Verify tsc + lint after code changes.
    Note: crewai/output/implement-09-performance.md
  expected_output: >
    Markdown baseline plus description of the listing (and any bundle)
    change.
  agent: performance_optimizer
  context:
    - item_8_docs
  output_file: output/implement-09-performance.md

item_10_roadmap:
  description: >
    ACTION 10 — Sequence the three open README roadmap epics at
    {repo_path}. Do not implement those features.

    Epics: Live dashboard charts / time series; NATS Cluster topology
    view; Multi-tab message comparison.

    Read README roadmap, docs/recommendations.md, dashboard feature,
    streams message browser, and whether nats server info exposes
    cluster/route data.

    Write docs/knowledge-base/ or a focused docs/roadmap-sequence.md
    with: assumptions, data sources, feature folders, dependencies,
    effort S/M/L, acceptance criteria, and what is explicitly out of
    scope. Optional backlog IDs (U4, M4, M5, K3, K4, A4, Q2, Q5, P2)
    remain optional choices.

    SKIP action 2. Do not build UI.

    Note: crewai/output/implement-10-roadmap.md
  expected_output: >
    Sequenced plan written into the repo plus a short task note.
  agent: feature_planner
  context:
    - item_9_performance
  output_file: output/implement-10-roadmap.md

item_report:
  description: >
    Write the final implementation report for cobra-nats {current_version}
    at {repo_path} ({repo_url}).

    Use git status --short and git diff --stat. Read the implement-0N
    notes under crewai/output/.

    Produce:
    1. What landed for actions 1, 3, 4, 5, 6, 7, 8, 9, 10
    2. Explicit statement that action 2 was skipped
    3. File list (from git status)
    4. Verification commands and outcomes
    5. Residual risks / follow-ups
    6. Reminder: this crew does not commit, push, or open PRs

    Do not start more code changes.
  expected_output: >
    A single markdown implementation report suitable for a human reviewer.
  agent: implement_reporter
  context:
    - item_1_runtime_schemas
    - item_3_nats_manager
    - item_4_ssrf_monitoring
    - item_6_route_cleanup
    - item_5_lifecycle_tests
    - item_7_playwright_isolation
    - item_8_docs
    - item_9_performance
    - item_10_roadmap
  output_file: output/implement-00-report.md
